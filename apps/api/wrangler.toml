name = "opencron"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Self-hosting on Cloudflare: see docs/deploy.md. Everything below works as-is for local development.

[vars]
DB_PROVIDER = "d1"
# Public URL of your deployment. Sign-in is accepted from its host (and from localhost).
APP_URL = "http://localhost:5173"
# "true" lets HTTP jobs and webhooks call private or internal addresses.
ALLOW_PRIVATE_TARGETS = "false"
# "closed" allows only the first account and refuses every sign-up after it.
SIGNUP = "open"
# Optional: a script sandbox on a server of your own, so script jobs can also be Python and Go. Run it with
# docker-compose.sandbox.yml and set SANDBOX_TOKEN as a secret (docs/deploy.md#python-and-go-on-cloudflare).
# SANDBOX_URL = "https://sandbox.example.com"

[secrets]
required = ["BETTER_AUTH_SECRET"]

# Serve on your own domain:
# [[routes]]
# pattern = "cron.example.com"
# custom_domain = true

[triggers]
crons = ["* * * * *"]

# The static web build (pnpm --filter @opencron/web build). Pages are `<path>.html` files; deep links into the app
# (`/app/...`, `/<lang>/app/...`) go to the Worker, which answers them with the app page (src/web-routes.ts).
[assets]
directory = "../web/dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/app/*", "/zh-Hans/app/*", "/ja/app/*", "/ko/app/*"]

# Create the database with `wrangler d1 create opencron` and paste its id here before deploying.
[[d1_databases]]
binding = "DB"
database_name = "opencron"
database_id = "00000000-0000-0000-0000-000000000000"

# Local development uses a simulated namespace. Before deploying, create one with
# `wrangler kv namespace create SCRIPT_KV` and add its `id` here.
[[kv_namespaces]]
binding = "SCRIPT_KV"

# Script jobs run as Dynamic Workers (JavaScript only, see docs/scripts.md).
[[worker_loaders]]
binding = "LOADER"

# Set with `wrangler secret put BETTER_AUTH_SECRET` before deploying. With SANDBOX_URL, also set SANDBOX_TOKEN, and
# SANDBOX_ACCESS_CLIENT_ID and SANDBOX_ACCESS_CLIENT_SECRET if the sandbox sits behind Cloudflare Access.
