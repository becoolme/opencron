name = "opencron"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
DB_PROVIDER = "postgres"
APP_URL = "http://localhost:5173"
ALLOW_PRIVATE_TARGETS = "false"
# "closed" allows only the first account and refuses every sign-up after it.
SIGNUP = "open"

[secrets]
required = ["BETTER_AUTH_SECRET", "DATABASE_URL"]

# [[routes]]
# pattern = "cron.example.com"
# custom_domain = true

[triggers]
crons = ["* * * * *"]

# The static web build (pnpm --filter @opencron/web build). Pages are `<path>.html` files; deep links into the app
# (`/app/...`, `/<lang>/app/...`) go to the Worker, which answers them with the app page (src/web-routes.ts).
[assets]
directory = "../web/dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/app/*", "/zh-Hans/app/*", "/ja/app/*", "/ko/app/*"]

# Local development uses a simulated namespace. Before production deployment,
# create a namespace and add its `id` here (see docs/development.md).
[[kv_namespaces]]
binding = "SCRIPT_KV"

[[worker_loaders]]
binding = "LOADER"

# Set with `wrangler secret put BETTER_AUTH_SECRET` in production.

# Optional Hyperdrive: replace DATABASE_URL in secrets.required with this binding.
# Disable Hyperdrive query caching for auth, scheduling and read-after-write consistency.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "your-hyperdrive-id"
