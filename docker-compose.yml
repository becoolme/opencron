# Self-hosted OpenCron: app + PostgreSQL + script sandbox.
#   cp .env.docker.example .env && edit it, then: docker compose up -d --build
# Read docs/docker.md before exposing it: the sandbox holds the Docker socket.

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${OPENCRON_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://opencron:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/opencron
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      SANDBOX_URL: http://sandbox:8787
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?set SANDBOX_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_started
    networks: [default, internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencron
      POSTGRES_DB: opencron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencron -d opencron"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  sandbox:
    build: ./apps/sandbox
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?set SANDBOX_TOKEN in .env}
      SANDBOX_CONCURRENCY: ${SANDBOX_CONCURRENCY:-4}
      SANDBOX_DOCKER_RUNTIME: ${SANDBOX_DOCKER_RUNTIME:-}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-none}
      SANDBOX_IMAGE_NODE: ${SANDBOX_IMAGE_NODE:-node:22-alpine}
      SANDBOX_IMAGE_PYTHON: ${SANDBOX_IMAGE_PYTHON:-python:3.12-alpine}
      SANDBOX_IMAGE_GO: ${SANDBOX_IMAGE_GO:-golang:1.23-alpine}
    volumes:
      # root-equivalent on the host: only this service gets it, and it is never published
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  internal:
    internal: true

volumes:
  postgres-data:
