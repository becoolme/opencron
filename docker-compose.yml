# Self-hosted OpenCron: app + PostgreSQL + script sandbox + Docker API guard.
#   cp .env.docker.example .env && edit it, then: docker compose up -d --build
# Read docs/docker.md before exposing it: the docker-guard service holds the Docker socket.

# What a script container may be: the sandbox builds runs from these and the guard refuses anything else.
x-run-settings: &run-settings
  SANDBOX_DOCKER_RUNTIME: ${SANDBOX_DOCKER_RUNTIME:-}
  SANDBOX_NETWORK: ${SANDBOX_NETWORK:-none}
  # empty means the images pinned in apps/sandbox/src/docker-args.mjs
  SANDBOX_IMAGE_NODE: ${SANDBOX_IMAGE_NODE:-}
  SANDBOX_IMAGE_PYTHON: ${SANDBOX_IMAGE_PYTHON:-}
  SANDBOX_IMAGE_GO: ${SANDBOX_IMAGE_GO:-}

services:
  app:
    build:
      context: .
      # built into the pages' links and the sitemap; rebuild (--build) after changing it
      args:
        APP_URL: ${APP_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "${OPENCRON_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://opencron:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/opencron
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      # the first account can always be created; "open" lets anyone who reaches the app sign up and run scripts
      SIGNUP: ${SIGNUP:-closed}
      SANDBOX_URL: http://sandbox:8787
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?set SANDBOX_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_started
    networks: [default, internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencron
      POSTGRES_DB: opencron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencron -d opencron"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  sandbox:
    build: ./apps/sandbox
    restart: unless-stopped
    environment:
      <<: *run-settings
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?set SANDBOX_TOKEN in .env}
      SANDBOX_CONCURRENCY: ${SANDBOX_CONCURRENCY:-4}
      SANDBOX_OWNER_CONCURRENCY: ${SANDBOX_OWNER_CONCURRENCY:-}
      # no socket here: Docker is reached only through the guard below
      DOCKER_HOST: tcp://docker-guard:2375
    depends_on:
      docker-guard:
        condition: service_healthy
    networks: [internal, docker-api]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # The only service with the Docker socket, which is root-equivalent on the host. It passes on just the calls the
  # sandbox needs, for run containers it rebuilds with the hardening flags (apps/sandbox/src/docker-policy.mjs).
  docker-guard:
    build: ./apps/sandbox
    command: ["node", "src/docker-guard.mjs"]
    restart: unless-stopped
    user: "0:0"
    environment:
      <<: *run-settings
      PORT: "2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [docker-api]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  internal:
    internal: true
  # the sandbox and the guard only: the app cannot reach the Docker API
  docker-api:
    internal: true

volumes:
  postgres-data:
